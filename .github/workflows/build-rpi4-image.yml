name: Build Raspberry Pi image

on:
  workflow_dispatch:
    inputs:
      install_mode:
        description: Image payload
        required: true
        default: minimal
        type: choice
        options: [minimal, full]
      image_size_gib:
        description: Uncompressed image size in GiB
        required: true
        default: "12"
        type: string
      compression:
        description: xz preset
        required: true
        default: balanced
        type: choice
        options: [balanced, maximum]
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: rpi4-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      OMARCHY_IMAGE_OUTPUT: ${{ github.workspace }}/build/image
      OMARCHY_IMAGE_SIZE_GIB: ${{ inputs.image_size_gib || '12' }}
      OMARCHY_XZ_PRESET: ${{ startsWith(github.ref, 'refs/tags/') && '-9e' || inputs.compression == 'maximum' && '-9e' || '-6' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged production source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A published image must carry an observed main tracking ref. Tags
          # on other commits remain source history, not production images.
          git fetch origin main
          if [[ $(git rev-parse HEAD) != "$(git rev-parse origin/main)" ]]; then
            echo 'Release tags must identify the current origin/main commit.' >&2
            exit 1
          fi
          git switch --force-create main "$GITHUB_SHA"
          git branch --set-upstream-to=origin/main main

      - name: Install image-building tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools dosfstools e2fsprogs gnupg parted python3 rsync xz-utils zerofree

      - name: Run focused Pi release gates
        # Tagged builds must pass the same regression gates as main.
        # Keep this separate from image assembly so failures are inexpensive.
        run: |
          test/shell.d/raspberry-pi-test.sh
          test/shell.d/rpi-imager-preseed-test.sh
          test/shell.d/rpi-owner-hostname-test.sh
          test/shell.d/rpi-display-test.sh
          test/shell.d/screensaver-test.sh
          test/shell.d/rpi-performance-test.sh
          test/shell.d/rpi-tune-test.sh
          test/shell.d/rpi-optimization-test.sh
          test/shell.d/rpi-update-safety-test.sh
          test/shell.d/rpi-firmware-test.sh
          test/shell.d/rpi-grow-root-test.sh
          test/shell.d/rpi-hyprland-verify-test.sh
          for test in test/shell.d/rpi45-image-*-test.sh; do
            bash "$test"
          done

      - name: Assemble signed-base ARM64 image
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            export OMARCHY_IMAGE_DOWNLOAD_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          fi
          sudo --preserve-env=OMARCHY_IMAGE_OUTPUT,OMARCHY_IMAGE_SIZE_GIB,OMARCHY_XZ_PRESET,OMARCHY_IMAGE_DOWNLOAD_BASE_URL \
            image/build-rpi4-image.sh --${{ inputs.install_mode || 'minimal' }}

      - name: Validate device-first Imager catalogs
        run: |
          for catalog in build/image/*.os-list.json build/image/os-list.json; do
            image/validate-imager-catalog.sh "$catalog" build/image
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-4-pi-${{ github.sha }}
          path: build/image/*
          compression-level: 0
          retention-days: 14

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          release_dir=$(mktemp -d "$RUNNER_TEMP/omarchy-release.XXXXXXXX")
          for image in build/image/*.img.xz; do
            image/prepare-release-assets.sh "$image" "$release_dir"
          done
          cp build/image/*.manifest.json build/image/*.audit.txt "$release_dir/"
          shopt -s nullglob
          for catalog in "$release_dir"/*.os-list.json "$release_dir"/os-list.json; do
            [[ -f $catalog ]] || continue
            image/validate-imager-catalog.sh "$catalog" "$release_dir"
            python3 - "$catalog" <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit
          with open(sys.argv[1]) as stream:
              assert all(urlsplit(image["url"]).scheme == "https" for image in json.load(stream)["os_list"])
          PY
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes \
              --title "Omarchy 4 Pi $GITHUB_REF_NAME" "${release_flags[@]}"
          gh release upload "$GITHUB_REF_NAME" "$release_dir"/* --clobber
