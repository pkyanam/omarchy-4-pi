name: Build Raspberry Pi image

on:
  workflow_dispatch:
    inputs:
      install_mode:
        description: Image payload
        required: true
        default: minimal
        type: choice
        options: [minimal, full]
      image_size_gib:
        description: Uncompressed image size in GiB
        required: true
        default: "12"
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: rpi4-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      OMARCHY_IMAGE_OUTPUT: ${{ github.workspace }}/build/image
      OMARCHY_IMAGE_SIZE_GIB: ${{ inputs.image_size_gib || '12' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image-building tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools dosfstools e2fsprogs gnupg parted rsync xz-utils

      - name: Build signed-base ARM64 image
        run: sudo --preserve-env=OMARCHY_IMAGE_OUTPUT,OMARCHY_IMAGE_SIZE_GIB image/build-rpi4-image.sh --${{ inputs.install_mode || 'minimal' }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-4-pi-${{ github.sha }}
          path: build/image/*
          compression-level: 0
          retention-days: 14

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Omarchy 4 Pi $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" build/image/* --clobber
