name: Pi port checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Parse image and Pi entrypoints
        run: |
          bash -n install-rpi4.sh
          bash -n build-packages-rpi4.sh
          bash -n image/audit-rpi4-rootfs.sh
          bash -n image/build-rpi4-image.sh
          bash -n image/generate-imager-catalog.sh
          bash -n image/prepare-release-assets.sh
          bash -n image/verify-rpi4-hyprland.sh
          bash -n bin/omarchy-rpi4-grow-root
          bash -n bin/omarchy-pi-status
      - name: Run focused Raspberry Pi tests
        run: |
          test/shell.d/raspberry-pi-test.sh
          test/shell.d/rpi-imager-preseed-test.sh
          test/shell.d/rpi-grow-root-test.sh
          test/shell.d/rpi-hyprland-verify-test.sh
