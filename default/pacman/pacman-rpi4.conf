# Pi 4 stable-4.5 package policy; boot remains firmware/U-Boot/linux-aarch64.
# See the pacman.conf(5) manpage for option and repository directives
# Arch Linux ARM provides the aarch64 repositories used below.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
# The Pi core pair is rebuilt from its reviewed fork, never from a repository.
IgnorePkg = omarchy omarchy-settings omarchy-dev omarchy-settings-dev
Architecture = aarch64
CheckSpace
ParallelDownloads = 2
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here. Omarchy comes first,
# as on x86_64, so a package it also publishes is installed from Omarchy.
[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
