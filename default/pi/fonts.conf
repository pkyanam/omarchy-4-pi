<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>Paper Mono</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Omarchy</family>
    </accept>
  </alias>
  <!-- Loaded after the packaged default. Keep Nerd/brand glyph fallback. -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Paper Mono</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Omarchy</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Paper Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Paper Mono</string></edit>
  </match>
</fontconfig>
