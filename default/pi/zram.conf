# Pi-specific fallback: a 4GB board gets 2GB of logical compressed swap.
# This is not preallocated RAM and no compression ratio is guaranteed.
# Later local drop-ins (for example 99-local.conf) take precedence.
[zram0]
zram-size = ram / 2
# Leave compression-algorithm unset: ALARM's inspected kernel only enables
# the LZO backend. Use the running kernel's default, never demand absent zstd.
swap-priority = 100
