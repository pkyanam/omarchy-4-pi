<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Omarchy 4 Pi placeholder banner</title>
  <desc id="description">A dark terminal-inspired placeholder banner for the Omarchy 4 Raspberry Pi project.</desc>
  <defs>
