# Raspberry Pi images must not create the owner until their root filesystem has
# expanded. Ordering alone still lets systemd start provisioning after a failed
# grow job; Requires= plus After= makes that failure close safely and leaves both
# first-boot markers in place for the next boot.
[Unit]
Requires=omarchy-rpi4-grow-root.service
After=omarchy-rpi4-grow-root.service
