# Keep a freshly flashed Pi out of SDDM until its one-shot owner setup succeeds.
# When provisioning is already complete, the owner's ConditionPathExists= check
# skips it and SDDM starts normally; a real setup failure cannot expose a
# user-less login screen.
[Unit]
Requires=omarchy-provision-owner.service
After=omarchy-provision-owner.service
